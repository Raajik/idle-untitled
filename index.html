<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Immortal Isparian Incremental</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="hidden">
      <h1 class="logo">
        <span class="logo-badge">III</span>
        <span class="logo-text"><span>Immortal</span><span>Isparian</span><span>Incremental</span></span>
      </h1>
      <div id="hero-summary"></div>
      <div id="sidebar-upkeep"></div>
      <nav id="tab-nav"></nav>
      <div id="nav-shortcuts"></div>
      <div id="sidebar-footer">
        <button class="icon-btn" data-action="export" title="Export save to the clipboard">⭳</button>
        <button class="icon-btn" data-action="import" title="Import a save from the clipboard">⭱</button>
        <button class="icon-btn danger" data-action="hard-reset" title="Hold Shift and click to wipe all progress. This cannot be undone.">☠</button>
        <button class="icon-btn" id="settings-btn" data-tab="settings" title="Settings">⚙</button>
      </div>
    </aside>
    <div id="content-col">
      <div id="battle-dock"></div>
      <main id="main"></main>
    </div>
  </div>
  <!-- Hover cards for the sidebar map live out here: the map scrolls, and a
       scroll container clips its children on both axes. See ui/render.js. -->
  <div id="hovercard-layer"></div>
  <div id="toasts"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
